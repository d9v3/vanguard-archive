# Les failles admises de deny.toml, où est leur preuve, recopiées pour un cargo audit lancé à la main et pour celui de
# la nuit dans la CI : rsa (RUSTSEC-2023-0071) et bincode (RUSTSEC-2025-0141), par YARA-X seulement. Rien d'autre ici :
# outils/verifier.sh refuse ce fichier s'il n'a pas les mêmes identifiants que deny.toml
# (outils/exceptions-rustsec.py --audit-toml).
[advisories]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2025-0141"]

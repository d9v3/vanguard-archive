# Intégration continue. À chaque envoi sur master (la publication du jour), sur Linux : la mise en forme, clippy sans
# aucune remarque sur les quatre cibles (Linux, Windows, les deux Mac) et les tests ; et le garde-fou de
# confidentialité sur les commits envoyés. Sur un vrai Windows de GitHub (PowerShell, registre, winget) : chaque nuit
# si le code a changé, à chaque demande de fusion, et à la demande (gh workflow run ci.yml) ; la compilation
# reproductible aussi, sauf pour une demande de fusion. Chaque nuit, même sans changement : les failles connues des
# dépendances. macOS a son propre workflow (macos.yml), qui teste et compile le programme universel pour la clé.
#
# Pourquoi pas Windows à chaque envoi : sur un dépôt privé, une minute de Windows en compte deux (une de Mac, dix),
# sur 2000 minutes gratuites par mois. Pour tester Windows à chaque envoi malgré tout : ajouter « push » à la
# condition du travail « utile » plus bas.
name: CI

on:
  # master seulement : l'étiquette vX.Y.Z que crée outils/publier-version.sh vise un commit déjà testé, et une
  # branche n'est poussée que pour son passage sur le Mac (outils/livrer-branche.sh), avant la fusion.
  # La CI tournait deux fois sur le même commit à chaque publication (la branche, puis master après la fusion).
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 3 h 43, heure de Montréal (après macos.yml). GitHub la lance souvent bien plus tard (4 h 30 de retard le
    # 18 oct. 2026, 7 h 15 le 19) : regarder `gh run list --workflow ci.yml --event schedule` avant de la croire
    # absente.
    - cron: "43 7 * * *"

# Le jeton par défaut du dépôt ne lit que le code : la vérification de nuit lit aussi les exécutions passées
# (gh api …/actions/workflows/…/runs), sinon GitHub répond 403.
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Compilateurs C : YARA-X (par wasmtime) compile un petit fichier C pour chaque cible ; musl-gcc pour Linux, le
      # gcc de MinGW pour Windows (et le préprocesseur de windres, pour l'icône et le manifeste), clang pour les cibles
      # Mac, qu'il vise sans les outils d'Apple (outils/mac-entetes).
      - name: Rust à jour, cibles et outils de compilation croisée
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu aarch64-apple-darwin x86_64-apple-darwin
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools gcc-mingw-w64-x86-64 clang
      # Actions venues d'autres que GitHub : épinglées par leur commit. Une étiquette (v2) se déplace ; si leur dépôt était
      # piraté, une version piégée toucherait ce que compile ce travail. À mettre à jour à la main (le commentaire dit la
      # version).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Mise en forme
        run: cargo fmt --check
      - name: Clippy, zéro remarque, sur les quatre cibles
        run: |
          entetes="$PWD/outils/mac-entetes"
          for c in x86_64-unknown-linux-musl x86_64-pc-windows-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            echo "::group::$c"
            v=${c//-/_}
            case $c in
              *-apple-darwin) env "CC_$v=clang" "CFLAGS_$v=-ffreestanding -nostdlibinc -I$entetes" \
                cargo clippy --all-targets --target "$c" -- -D warnings ;;
              *) cargo clippy --all-targets --target "$c" -- -D warnings ;;
            esac
            echo "::endgroup::"
          done
      # .cargo/config.toml vise la cible musl : « cargo test » teste la version qui part sur la clé.
      - name: Tests
        run: cargo test
      # Le programme de mise au point, que les tests viennent de compiler (tests/programme.rs le lance) : la version
      # optimisée est compilée sur l'ordinateur de développement avant chaque envoi (outils/deployer.sh), et la nuit
      # par le travail « reproductible ». La recompiler ici prenait une minute et demie à chaque envoi.
      - name: Le programme démarre et répond
        run: |
          ./target/x86_64-unknown-linux-musl/debug/vanguard --version
          ./target/x86_64-unknown-linux-musl/debug/vanguard logiciels --liste
          ./target/x86_64-unknown-linux-musl/debug/vanguard nettoyer --liste
      # Les règles YARA intégrées au programme, compilées par le moteur de VirusTotal (libyara dans yara-python) : une
      # règle cassée par une mise à jour (outils/maj-yara.sh) se voit ici, pas chez quelqu'un.
      - name: Règles YARA
        run: |
          python3 -m venv /tmp/yara
          /tmp/yara/bin/pip install -q yara-python
          /tmp/yara/bin/python -c "import yara; yara.compile(filepath='assets/yara/reversinglabs.yara'); print('règles YARA compilées')"
      # Liens internes de la documentation : fichiers visés, titres des ancres. Les liens web, eux, sont vérifiés
      # avant chaque envoi et chaque version (outils/liens.py) : un site en panne ne doit pas faire échouer la CI.
      - name: Liens internes
        run: python3 outils/liens.py --hors-ligne

  # Garde-fou de confidentialité (outils/confidentialite.py) sur les commits de chaque envoi et de chaque demande de
  # fusion, second filet de celui qui tourne avant chaque commit et chaque envoi sur l'ordinateur de développement. Ici
  # en mode générique : seulement ce qui se reconnaît à sa forme (dossier personnel d'un compte, courriel, SID de
  # Windows) ; l'identité de la machine qui le lance n'y entre pas, le compte « runner » et /home/runner ne sont à
  # personne. Les valeurs trouvées sont coupées dans le journal, lisible sur GitHub.
  confidentialite:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tout l'historique : le commit d'avant l'envoi doit être là pour savoir ce qui a été envoyé.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # AVANT vide ou fait de zéros (branche neuve), ou disparu (historique réécrit) : les commits qu'aucune autre
      # branche de GitHub n'a déjà. Les empreintes passent par l'environnement, jamais collées dans le script.
      - name: Rien de personnel dans les commits envoyés
        env:
          AVANT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          APRES: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 outils/confidentialite.py --generique --plage "$AVANT" "$APRES"

  # Failles connues dans les dépendances (base RustSec, cargo audit) : chaque nuit, même sans changement de code, car
  # les failles arrivent sans lui ; et à la demande. Linux seulement, lecture seule : un avis le lendemain plutôt que
  # des mois plus tard.
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # cargo-audit tel que RustSec le publie (ses versions sur GitHub), posé en quelques secondes : le compiler ici
      # (cargo install) prenait trois minutes et demie chaque nuit. Rien d'autre à compiler : seul Cargo.lock est lu.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  # Windows la nuit seulement si le code a changé depuis le dernier passage réussi (comme macos.yml).
  utile:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.verifier.outputs.windows }}
    steps:
      - id: verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch|pull_request) echo "windows=oui" >> "$GITHUB_OUTPUT"; exit 0 ;;
            schedule) ;;
            *) echo "windows=non" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          dernier=""
          for evenement in schedule workflow_dispatch; do
            sha=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&event=$evenement&branch=${{ github.ref_name }}&per_page=1" -q '.workflow_runs[0] | "\(.created_at) \(.head_sha)"' 2>/dev/null || true)
            if [ -n "$sha" ] && [ "$sha" \> "$dernier" ]; then dernier=$sha; fi
          done
          dernier=${dernier#* }
          # Le code a changé : un fichier hors de la documentation, des captures et des outils de développement, que le
          # programme n'intègre pas (comme macos.yml). Comparaison impossible : on teste.
          HORS_CODE='^(.*\.md|\.claude/.*|\.relecture/.*|outils/.*|assets/captures/.*|assets/partage\.png|\.github/depot\.json|LICENCES-TIERCES\.txt|\.gitignore)$'
          windows=oui
          if [ "$dernier" = "${{ github.sha }}" ]; then
            windows=non
          elif [ -n "$dernier" ] && fichiers=$(gh api "repos/${{ github.repository }}/compare/$dernier...${{ github.sha }}" -q '[.files[].filename] | if length < 300 then .[] else "plus de 300 fichiers" end'); then
            printf '%s\n' "$fichiers" | grep -vE -e '^$' -e "$HORS_CODE" >/dev/null || windows=non
          fi
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  # Compilation reproductible : le même code, compilé deux fois de suite, doit donner exactement le même programme
  # (Linux et Windows). C'est la condition de la preuve d'intégrité d'un programme non signé : avec les mêmes outils
  # (version de rustc, MinGW, --remap-path-prefix de ~/.cargo/config.toml), n'importe qui retrouve l'empreinte de la
  # page de la version. La nuit et à la demande seulement, et seulement si le code a changé (même règle que Windows) :
  # deux compilations en release coûtent plusieurs minutes.
  reproductible:
    needs: utile
    if: needs.utile.outputs.windows == 'oui' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # gcc-mingw-w64 : l'éditeur de liens du .exe, et le préprocesseur de windres (icône et manifeste intégrés comme
      # dans le .exe livré). Avec les binutils seuls, la première nuit a échoué : « linker x86_64-w64-mingw32-gcc not
      # found ».
      - name: Rust à jour, cibles et outils de compilation croisée
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Les deux cibles d'un seul cargo : l'optimisation finale (LTO, une seule unité de code) n'occupe qu'un cœur par
      # programme, et cargo les mène de front ; deux cargo lancés ensemble s'attendraient (verrou du dossier).
      - name: Deux compilations, un seul programme
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --target x86_64-pc-windows-gnu
          mkdir premiere
          cp target/x86_64-unknown-linux-musl/release/vanguard premiere/vanguard
          cp target/x86_64-pc-windows-gnu/release/vanguard.exe premiere/vanguard.exe
          # Seul le programme est recompilé (les dépendances restent) : c'est lui que l'on compare.
          cargo clean -p vanguard --release --target x86_64-unknown-linux-musl
          cargo clean -p vanguard --release --target x86_64-pc-windows-gnu
          cargo build --release --target x86_64-unknown-linux-musl --target x86_64-pc-windows-gnu
          sha256sum premiere/vanguard target/x86_64-unknown-linux-musl/release/vanguard
          sha256sum premiere/vanguard.exe target/x86_64-pc-windows-gnu/release/vanguard.exe
          cmp premiere/vanguard target/x86_64-unknown-linux-musl/release/vanguard
          cmp premiere/vanguard.exe target/x86_64-pc-windows-gnu/release/vanguard.exe

  windows:
    needs: utile
    if: needs.utile.outputs.windows == 'oui'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Rust à jour
        run: |
          rustup update stable
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # La cible est donnée : .cargo/config.toml vise Linux par défaut. Ici, PowerShell existe vraiment (pas comme
      # sous Wine) : les tests lisent le vrai registre et le vrai système.
      - name: Tests sur un vrai Windows
        run: cargo test --target x86_64-pc-windows-msvc
      # Le programme de mise au point, que les tests viennent de compiler : le .exe livré est celui de MinGW, compilé
      # sur l'ordinateur de développement (et la nuit par le travail « reproductible »). Une version optimisée pour
      # MSVC, jamais livrée, prenait ici près de quatre minutes, comptées deux fois.
      - name: Essai du programme (lecture seule)
        run: |
          $s = ".\target\x86_64-pc-windows-msvc\debug\vanguard.exe"
          & $s --version
          & $s machine --json > audit.json
          Get-Content audit.json -TotalCount 40
          & $s logiciels --liste
          & $s nettoyer --liste
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: essai-windows
          path: audit.json
          retention-days: 14

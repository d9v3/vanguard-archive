# Claude sur GitHub : écrire @claude dans un ticket, une demande de fusion (PR) ou un commentaire pour lui poser une
# question ou lui demander une correction ; il suit CLAUDE.md. Seuls les membres du dépôt peuvent le déclencher.
# Activation, une fois : /install-github-app dans Claude Code (application GitHub + secret CLAUDE_CODE_OAUTH_TOKEN,
# le jeton de l'abonnement Claude, que donne `claude setup-token`).
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # .cargo/config.toml vise la cible musl : sans elle, cargo test ne compile pas.
      - name: Rust à jour
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(cargo build:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo fmt:*)"

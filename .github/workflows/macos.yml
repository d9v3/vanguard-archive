# Version macOS de Gardien : compilée et testée sur un vrai Mac de GitHub (Apple Silicon), puisqu'il n'y a pas
# de Mac à la maison. Le programme produit est universel (Apple Silicon + Intel) ; outils/deployer.sh le
# récupère pour la clé USB (dossier macOS/).
#
# Minutes de Mac comptées 10 fois sur un dépôt privé (2000 minutes gratuites par mois, soit environ 200 de Mac) :
# la compilation de nuit ne part que si le code a changé depuis la dernière réussie.
name: macOS

on:
  workflow_dispatch:
    inputs:
      essai_complet:
        description: "Essai complet de chaque fonction (outils/test-macos/essai.sh), en plus de la compilation"
        type: boolean
        default: false
  push:
    branches: [macos]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", ".github/workflows/macos.yml"]
  schedule:
    - cron: "17 7 * * *" # 3 h 17, heure de Montréal

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utile:
    runs-on: ubuntu-latest
    outputs:
      compiler: ${{ steps.verifier.outputs.compiler }}
    steps:
      - id: verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "compiler=oui" >> "$GITHUB_OUTPUT"; exit 0; fi
          dernier=$(gh api "repos/${{ github.repository }}/actions/workflows/macos.yml/runs?status=success&branch=${{ github.ref_name }}&per_page=1" -q '.workflow_runs[0].head_sha // ""')
          if [ "$dernier" = "${{ github.sha }}" ]; then echo "compiler=non" >> "$GITHUB_OUTPUT"; else echo "compiler=oui" >> "$GITHUB_OUTPUT"; fi

  mac:
    needs: utile
    if: needs.utile.outputs.compiler == 'oui'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust à jour (Apple Silicon et Intel)
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml vise Linux par défaut : la cible est toujours donnée.
      - name: Tests
        run: cargo test --target aarch64-apple-darwin
      - name: Compilation
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output gardien \
            target/aarch64-apple-darwin/release/gardien target/x86_64-apple-darwin/release/gardien
          lipo -info gardien
          ./gardien --version
          echo "${{ github.sha }}" > commit.txt
      - name: Essai du programme sur ce Mac
        run: |
          ./gardien machine --json > audit.json || true
          head -c 3000 audit.json
          ./gardien diagnostic | tail -20 || true
      - name: Essai complet
        if: github.event_name == 'workflow_dispatch' && inputs.essai_complet
        run: bash outils/test-macos/essai.sh ./gardien essai
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.essai_complet
        with:
          name: essai-macos
          path: essai
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: gardien-macos
          path: |
            gardien
            commit.txt
            audit.json
          retention-days: 30

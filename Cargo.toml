[package]
name = "gardien"
version = "0.60.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
argon2 = "0.6.0"
blake3 = { version = "1.8.7", default-features = false, features = ["pure", "std"] }
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
dns-lookup = "4.0.2"
futures = "0.3.34"
getrandom = "0.4.3"
if-addrs = "0.15.0"
notify = { version = "8.2.0", default-features = false }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }

[target."cfg(windows)".dependencies]
enable-ansi-support = "0.3.1"
winreg = "0.56.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# Surveillance des fichiers en direct (intégrité) : FSEvents sous macOS.
[target."cfg(target_os = \"macos\")".dependencies]
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"

# Mode strict de clippy (pedantic) par défaut, sauf trois règles qui ne sont ici que du bruit :
# noms propres dans les commentaires en français, longues fonctions d'audit, `use ui::*`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"

[dev-dependencies]
proptest = "1.12.0"

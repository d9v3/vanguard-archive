[package]
name = "netscan"
version = "0.6.2"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
dns-lookup = "4.0.2"
futures = "0.3.34"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }

[target."cfg(windows)".dependencies]
enable-ansi-support = "0.3.1"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[profile.release]
strip = true
lto = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"

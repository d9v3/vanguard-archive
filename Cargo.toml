[package]
name = "vanguard"
version = "0.85.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
argon2 = "0.6.0"
blake3 = { version = "1.8.7", default-features = false, features = ["pure", "std"] }
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
dns-lookup = "4.0.2"
futures = "0.3.34"
getrandom = "0.4.3"
if-addrs = "0.15.0"
inventory = "0.3.25"
miniz_oxide = "0.9.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
# HTTPS en Rust : les fonctions par défaut (HTTP/2, proxy du système, jeux de caractères) avec rustls, mais ring pour
# le chiffrement au lieu d'aws-lc, qui compile du C impossible à construire ici pour macOS et pèse le double.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "charset", "http2", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
notify = { version = "8.2.0", default-features = false }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
# SHA-256 : l'empreinte du script lancé en administrateur sous Windows, vérifiée par la fenêtre élevée avant de
# l'exécuter ; celle des programmes et des fichiers des traces collectées, à chercher sur VirusTotal.
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "1.53.3", features = ["full"] }
# Le moteur YARA en Rust (VirusTotal) : seulement les modules dont les règles intégrées ont besoin (pe, elf).
# YARA-X 1.22.0 demande wasmtime 48.0.6 ou plus ; Cargo.lock retient 48.0.7, la première de la série 48 qui corrige
# aussi RUSTSEC-2026-0379 (Cranelift, saut mal calculé sur aarch64 : les Mac Apple Silicon). Ce n'est donc pas
# imposé ici, mais cargo deny refuse un retour en arrière (deny.toml n'admet pas cette faille). Une dépendance directe
# à wasmtime l'imposerait, mais en garderait deux versions dès que YARA-X passerait à la série suivante.
yara-x = { version = "1.22.0", default-features = false, features = ["pe-module", "elf-module", "constant-folding", "exact-atoms", "fast-regexp"] }
ed25519-dalek = { version = "3.0.0", default-features = false }

[target."cfg(windows)".dependencies]
enable-ansi-support = "0.3.1"
winreg = "0.56.0"
# WMI et COM sans PowerShell (Microsoft) : seulement les fonctions lues par Vanguard, jamais l'interface graphique
# (Win32_UI_WindowsAndMessaging seulement pour la taille et la place de la fenêtre de la console, voir fenetre.rs) ; Win32_UI_Shell_PropertiesSystem n'en est pas : les propriétés d'un volume (BitLocker). Win32_Security : les SID et les droits des comptes ; TaskScheduler : les tâches planifiées ; UpdateAgent : Windows Update.
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# Surveillance des fichiers en direct (intégrité) : FSEvents sous macOS.
[target."cfg(target_os = \"macos\")".dependencies]
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
# Dépassements de capacité vérifiés aussi dans la version publiée : l'option que cite la note du chapitre « Traitement
# des entiers » du guide Rust sécurisé de l'ANSSI. Elle ne remplace pas sa règle LANG-ARITH, qui veut des opérations
# explicites (checked_, saturating_, wrapping_…) partout où un entier peut déborder, quel que soit le profil : c'est
# un filet pour celles qu'on oublie. Sans lui, une taille ou un décalage lu dans une donnée hostile (paquet réseau,
# bail, journal, fichier PE) qui déborde repart à zéro en silence et fausse la suite de la lecture ; ici, il panique,
# comme en développement. La panique est rattrapée autour de chaque règle et de chaque domaine du bilan, de chaque
# mesure DNS de l'audit et de chaque fichier analysé par YARA (« non vérifié », journal::rattraper) : panic garde donc
# sa valeur par défaut, « unwind », jamais « abort ». Hors de ces gardes, sur le fil principal, elle arrête la
# commande. Dans un autre fil, elle n'arrête que lui, s'affiche et se note comme un plantage, et l'appelant qui le
# joint en fait ce qu'il a prévu : souvent « non vérifié », parfois un résultat vide qui ne se dit pas (Flatpak, Snap,
# AUR, micrologiciels et DKMS de machine/linux/maj.rs, Windows Update, Homebrew, constats réseau et carnet relus par
# audit::auditer). Ce filet ne dispense donc jamais d'une opération explicite : une somme de données que n'importe
# quel programme peut poser (tailles de fichiers creux à nettoyer ou à copier) sature, au lieu de compter sur lui.
overflow-checks = true

# Les bibliothèques en développement : seulement les numéros de ligne (les traces d'erreur restent lisibles). Avec toutes
# leurs informations de débogage, YARA-X et wasmtime portaient le programme de test au-delà de 400 Mo, plus que ce que la
# mise à jour depuis la clé accepte de lire (mise_a_jour.rs, TAILLE_MAX).
[profile.dev.package."*"]
debug = "line-tables-only"

# SHA-256 optimisé même en développement : sans cela, les empreintes des traces (programmes en marche, fichiers récents)
# prenaient plus d'une minute dans `cargo run` et dans les tests, contre quelques secondes une fois optimisé.
[profile.dev.package.sha2]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"

# Mode strict de clippy (pedantic) par défaut, sauf trois règles qui ne sont ici que du bruit :
# noms propres dans les commentaires en français, longues fonctions d'audit, `use ui::*`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"

[dev-dependencies]
proptest = "1.12.0"
